server_tokens off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name email.digitalwarehouse.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://email.digitalwarehouse.io$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name email.digitalwarehouse.io;

    ssl_certificate /etc/letsencrypt/live/email.digitalwarehouse.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/email.digitalwarehouse.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 100m;
    client_body_timeout 15s;

    location /emailvalidation.v1.EmailValidationService/ {
        grpc_pass grpc://127.0.0.1:8081;
        grpc_set_header Host $host;
        grpc_set_header Authorization $http_authorization;
        grpc_set_header X-Forwarded-For $remote_addr;
        grpc_set_header X-Forwarded-Host $host;
        grpc_set_header X-Forwarded-Proto https;
        grpc_read_timeout 1h;
        grpc_send_timeout 1h;
    }

    location /emailvalidation.status.v1.EmailValidationStatus/ {
        grpc_pass grpc://127.0.0.1:8081;
        grpc_set_header Host $host;
        grpc_set_header Authorization $http_authorization;
        grpc_set_header X-Forwarded-For $remote_addr;
        grpc_set_header X-Forwarded-Host $host;
        grpc_set_header X-Forwarded-Proto https;
        grpc_read_timeout 1h;
        grpc_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}
